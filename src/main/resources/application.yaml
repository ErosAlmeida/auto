spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_data
    username: postgres
    password: postgres

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration